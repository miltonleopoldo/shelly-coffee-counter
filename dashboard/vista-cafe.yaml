           <span>${sum} bebidas desde ${desde}${sum ? ' · hora mais forte: ' + pk + 'h' : ''}</span></div></div>
         <style>.cw{display:none}@media (min-width:1700px){.cn{display:none}.cw{display:block}}</style><div class="cn">${draw(1000)}</div><div class="cw">${draw(2000)}</div></div>`;
