        const tot=e.map((v,i)=>v+l[i]+k[i]), max=Math.max(1,...tot), sum=tot.reduce((a,b)=>a+b,0);
        const draw = (W) => { const H=230, top=24, base=190, bw=W/24;
        let g='';
        for (let y=1; y<=4; y++){ const v=Math.ceil(max*y/4); const yy=base-(v/max)*(base-top); g+=`<line x1="0" x2="${W}" y1="${yy}" y2="${yy}" stroke="${div}" stroke-width="1"/><text x="2" y="${yy-3}" font-size="10" fill="${muted}">${v}</text>`; }
        const nowH=new Date().getHours();
        for (let i=0;i<24;i++){ const x=i*bw+bw*0.18, w=bw*0.64; const he=(e[i]/max)*(base-top), hl=(l[i]/max)*(base-top), hk=(k[i]/max)*(base-top), hc=he+hl;
          if(he) g+=`<rect x="${x}" y="${base-he}" width="${w}" height="${he}" rx="3" fill="#b07a52"/>`; if(hl) g+=`<rect x="${x}" y="${base-he-hl}" width="${w}" height="${hl}" rx="3" fill="#c8956b"/>`;
