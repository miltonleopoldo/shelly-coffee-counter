          g+=`<text x="${i*bw+bw/2}" y="${base+16}" text-anchor="middle" font-size="11" fill="${i===nowH?'var(--primary-color)':muted}">${i}h</text>`; }
        return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>`; };
        const pk=tot.indexOf(Math.max(...tot));
