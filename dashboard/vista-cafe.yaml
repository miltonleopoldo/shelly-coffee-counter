# Vista Café (sections) - cola em Editar dashboard > Editor de texto, dentro de views:
# Precisa de: button-card, apexcharts-card (HACS) e do pacote cafe.yaml
title: Café
path: cafe
icon: mdi:coffee
type: sections
max_columns: 4
sections:
- type: grid
  column_span: 4
  cards:
  - type: custom:button-card
    show_name: false
    show_icon: false
    show_state: false
    update_timer: 20s
    tap_action:
      action: none
    variables:
      sub: CAFÉ · MÁQUINA
      line: Consumo e stock de cápsulas.
      rows:
      - - EXTRAÇÃO
        - binary_sensor.cafe_a_extrair
      - - HOJE
        - sensor.cafes_hoje
      - - ESTA SEMANA
        - sensor.cafes_esta_semana
      - - STOCK
        - sensor.cafe_stock
        - min
        - 20
      - - DIAS DE STOCK
        - sensor.cafe_stock_dias
        - min
        - 5
      - - MANUTENÇÃO
        - input_boolean.cafe_manutencao
        - 'off'
    triggers_update:
    - binary_sensor.cafe_a_extrair
    - sensor.cafes_hoje
    - sensor.cafes_esta_semana
    - sensor.cafe_stock
    - sensor.cafe_stock_dias
    - input_boolean.cafe_manutencao
    custom_fields:
      hud: |-
        [[[
        const V=variables;const C='#00e5ff',W='#ffb300',R='#ff4d4d';
        const tr={off:'DESLIGADO',on:'LIGADO',cool:'A ARREFECER',heat:'A AQUECER',auto:'AUTOMÁTICO',heat_cool:'AUTOMÁTICO',dry:'DESUMIDIFICAR',fan_only:'VENTILAÇÃO',unavailable:'INDISPONÍVEL',unknown:'DESCONHECIDO'};
        let alert='';let rows='';
        V.rows.forEach((r)=>{let st=states[r[1]];let v='--';let bad=false;
        if(String(r[1]).charAt(0)==='@'){st=null;const all=Object.values(states);
        if(r[1]==='@count'){v=String(all.filter((s)=>s.entity_id.indexOf(r[2]+'.')===0&&(!r[3]||s.state===r[3])).length);}
        else{const b=all.filter((s)=>s.entity_id.indexOf('sensor.')===0&&s.attributes.device_class==='battery'&&!isNaN(parseFloat(s.state))).map((s)=>[parseFloat(s.state),s.attributes.friendly_name||s.entity_id]).sort((x,y)=>x[0]-y[0]);
        if(r[1]==='@batcount')v=String(b.length);
        if(r[1]==='@batlow'){const n=b.filter((x)=>x[0]<r[2]).length;v=String(n);bad=n>0;if(bad&&!alert)alert='ATENÇÃO: '+n+(n===1?' BATERIA':' BATERIAS')+' ABAIXO DE '+r[2]+' %';}
        if(r[1]==='@batmin'&&b.length){v=Math.round(b[0][0])+' % · '+String(b[0][1]).replace(/ battery| bateria/i,'').toUpperCase().slice(0,22);bad=b[0][0]<r[2];}}}
        if(st){const x=parseFloat(st.state);const u=st.attributes.unit_of_measurement||'';
        if(r[2]==='off'){bad=st.state==='on';v=bad?'SIM':'NÃO';}
        else if(!isNaN(x)&&String(st.state).trim()!==''&&isFinite(st.state)){v=(Math.round(x*10)/10)+' '+u;if(r[2]==='max'&&x>r[3])bad=true;if(r[2]==='min'&&x<r[3])bad=true;}
        else{v=(tr[st.state]||st.state).toUpperCase();if(r[2]==='ok'&&st.state!==r[3])bad=true;}
        if(st.state==='unavailable'||st.state==='unknown'){v=tr[st.state];bad=true;}}
        if(bad&&!alert)alert='ATENÇÃO: '+r[0]+(r[2]==='off'?' ATIVO':' FORA DO NORMAL');
        rows+='<div class="r"><span>'+r[0]+'</span><i></i><b style="color:'+(bad?W:'#d6f6ff')+'">'+v+'</b></div>';});
        const n=new Date();const hh=String(n.getHours()).padStart(2,'0');const mm=String(n.getMinutes()).padStart(2,'0');
        const dt=n.toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase();
        return '<style>'
        +'.w{display:grid;grid-template-columns:150px 1fr auto;gap:26px;align-items:center;padding:16px 26px;text-align:left}'
        +'.t{font-size:12px;letter-spacing:.42em;color:#6fb9cf}'
        +'.n{font-size:34px;font-weight:700;letter-spacing:.3em;color:#00e5ff;text-shadow:0 0 18px rgba(0,229,255,.75);line-height:1.15}'
        +'.g{font-size:16px;color:#d6f6ff;margin-top:8px;letter-spacing:.04em}'
        +'.m{font-size:12px;letter-spacing:.2em;margin-top:6px}'
        +'.c{font-size:64px;font-weight:300;letter-spacing:.06em;color:#d6f6ff;text-shadow:0 0 22px rgba(0,229,255,.55);line-height:1;text-align:right}'
        +'.d{font-size:11px;letter-spacing:.24em;color:#6fb9cf;text-align:right;margin-top:6px}'
        +'.s{margin-top:12px;min-width:330px}'
        +'.r{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.18em;padding:3px 0}'
        +'.r span{color:#6fb9cf}.r i{flex:1;border-bottom:1px dotted rgba(0,229,255,.3)}.r b{font-weight:600}'
        +'.w>div{min-width:0}@media(max-width:900px){.w{grid-template-columns:1fr;text-align:center;gap:12px;padding:14px 14px}.c,.d{text-align:center}.x{margin:0 auto;width:92px;height:92px}.t{font-size:10px;letter-spacing:.22em}.n{font-size:24px;letter-spacing:.2em}.g{font-size:14px}.m{font-size:11px;letter-spacing:.12em}.c{font-size:46px}.d{font-size:10px;letter-spacing:.12em}.s{min-width:0;margin-top:10px}.r{font-size:11px;letter-spacing:.08em;gap:8px}.r b{text-align:right}}'
        +'</style>'
        +'<div class="w"><svg class="x" viewBox="0 0 200 200" width="150" height="150">'
        +'<circle cx="100" cy="100" r="94" fill="none" stroke="'+C+'" stroke-opacity=".35" stroke-width="1"/>'
        +'<g><circle cx="100" cy="100" r="84" fill="none" stroke="'+C+'" stroke-width="5" stroke-dasharray="70 18 8 18" stroke-opacity=".9"/><animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="18s" repeatCount="indefinite"/></g>'
        +'<g><circle cx="100" cy="100" r="68" fill="none" stroke="'+C+'" stroke-width="2" stroke-dasharray="3 9" stroke-opacity=".8"/><animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="26s" repeatCount="indefinite"/></g>'
        +'<g><circle cx="100" cy="100" r="54" fill="none" stroke="'+(alert?W:C)+'" stroke-width="8" stroke-dasharray="26 8" stroke-opacity=".85"/><animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="9s" repeatCount="indefinite"/></g>'
        +'<circle cx="100" cy="100" r="36" fill="'+C+'" fill-opacity=".10" stroke="'+C+'" stroke-width="1.5"/>'
        +'<circle cx="100" cy="100" r="20" fill="'+(alert?W:C)+'"><animate attributeName="fill-opacity" values=".35;.95;.35" dur="2.4s" repeatCount="indefinite"/><animate attributeName="r" values="18;22;18" dur="2.4s" repeatCount="indefinite"/></circle>'
        +'</svg>'
        +'<div><div class="t">'+V.sub+'</div><div class="n">J.A.R.V.I.S.</div>'
        +'<div class="g">'+V.line+'</div>'
        +'<div class="m" style="color:'+(alert?W:C)+'">'+(alert||'TODOS OS SISTEMAS OPERACIONAIS')+'</div></div>'
        +'<div><div class="c">'+hh+':'+mm+'</div><div class="d">'+dt+'</div><div class="s">'+rows+'</div></div></div>';
        ]]]
    styles:
      card:
      - padding: '0'
      - cursor: default
      grid:
      - grid-template-areas: '"hud"'
      - grid-template-columns: 1fr
      custom_fields:
        hud:
        - width: 100%
    grid_options:
      columns: full
- type: grid
  column_span: 4
  cards:
  - type: heading
    heading: Consumo de café
    heading_style: title
    icon: mdi:coffee
  - type: custom:button-card
    entity: binary_sensor.cafe_a_extrair
    show_name: false
    show_icon: false
    show_state: false
    tap_action:
      action: none
    triggers_update:
    - sensor.coffee_machine_power
    - input_text.cafe_ultima
    - switch.coffee_machine
    - sensor.cafes_hoje
    - sensor.coffee_machine_energy
    - input_boolean.cafe_manutencao
    styles:
      card:
      - padding: 16px
      - border-radius: 16px
      - height: 340px
      - box-sizing: border-box
      grid:
      - grid-template-areas: '"x"'
      - grid-template-columns: 1fr
      - grid-template-rows: 1fr
      - align-content: stretch
      - height: 100%
      custom_fields:
        x:
        - width: 100%
        - text-align: left
        - height: 100%
        btn:
        - position: absolute
        - right: 16px
        - bottom: 16px
        - width: auto
        man:
        - position: absolute
        - left: 16px
        - bottom: 16px
        - width: auto
    custom_fields:
      x: |
        [[[ const muted='var(--secondary-text-color)'; const n=e=>parseFloat(states[e]?.state);
        const hdr=(ic,t)=>`<div style="display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:${muted}"><ha-icon icon="${ic}" style="margin:0;--mdc-icon-size:18px"></ha-icon>${t}</div>`;
        const on=entity.state==='on', p=n('sensor.coffee_machine_power'), sw=states['switch.coffee_machine']?.state, last=states['input_text.cafe_ultima']?.state||'—';
        const c=new Date(2024,10,20), d=new Date(); let m=(d.getFullYear()-c.getFullYear())*12+d.getMonth()-c.getMonth(); if(d.getDate()<c.getDate()) m--;
        const a=Math.floor(m/12), r=m%12; const idade=[a?a+(a>1?' anos':' ano'):'', r?r+(r>1?' meses':' mês'):''].filter(Boolean).join(' e ')||'menos de 1 mês';
        const man=states['input_boolean.cafe_manutencao']?.state==='on'; const st=man?'Manutenção — não conta':on?'A tirar café…':sw==='on'?'Ligada':'Desligada', col=man?'#fb8c00':on?'#fb8c00':sw==='on'?'#43a047':muted;
        const tile=(l,v)=>`<div style="background:var(--secondary-background-color,rgba(127,127,127,.08));border-radius:10px;padding:8px 10px;min-width:0"><div style="font-size:11px;color:${muted};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l}</div><div style="font-size:20px;font-weight:500">${v}</div></div>`;
        return `<div style="display:flex;flex-direction:column;justify-content:space-between;height:100%;gap:10px">${hdr('mdi:coffee-maker','Máquina')}
        <div style="display:flex;gap:12px;align-items:center">
         <div style="flex:0 0 118px;height:118px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden"><img src="https://dam.delonghigroup.com/902x902/assets/207904" style="width:100%;height:100%;object-fit:contain" alt="Lattissima One Evo"></div>
         <div style="min-width:0;display:flex;flex-direction:column;gap:2px">
          <div style="font-size:13px;color:${muted}">De'Longhi · Nespresso</div>
          <div style="font-size:19px;font-weight:600;line-height:1.2">Lattissima One Evo</div>
          <div style="font-size:13px;color:${muted}">Modelo EN510.B</div>
          <div style="font-size:13px;color:${muted};word-break:break-all">N.º série XXXXXXXXXXXXXXXXXXX</div>
          <div style="font-size:13px;color:${muted}">Comprada a 20/11/2024 · há ${idade}</div>
         </div></div>
        <div style="display:flex;align-items:center;gap:10px"><span style="width:10px;height:10px;border-radius:50%;background:${col};flex:0 0 10px"></span><span style="font-size:17px;font-weight:500">${st}</span><span style="font-size:13px;color:${muted}">${isNaN(p)?'':'· '+Math.round(p)+' W agora'}</span></div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">${[['Bebidas hoje',(Math.round(n('sensor.cafes_hoje'))||0)],['Pico 3 min',Math.round(n('sensor.cafe_potencia_maxima_recente')||0)+' W'],['Energia tomada',((n('sensor.coffee_machine_energy')+0.1939)*1000).toFixed(0)+' Wh'],['Conta acima de','600 W']].map(([l,v])=>tile(l,v)).join('')}</div>
        <div style="height:34px"></div></div>`; ]]]
      btn:
        card:
          type: custom:button-card
          name: Comprar café
          icon: mdi:cart-outline
          show_state: false
          layout: icon_name
          tap_action:
            action: url
            url_path: https://www.nespresso.com/pt/
          styles:
            card:
            - background: '#b07a52'
            - border-radius: 20px
            - padding: 7px 14px
            - box-shadow: none
            - border: none
            - color: '#fff'
            grid:
            - grid-template-areas: '"i n"'
            - grid-template-columns: 20px auto
            - column-gap: 6px
            icon:
            - width: 18px
            - color: '#fff'
            name:
            - font-size: 14px
            - font-weight: '500'
            - color: '#fff'
            - justify-self: start
      man:
        card:
          type: custom:button-card
          entity: input_boolean.cafe_manutencao
          name: Manutenção
          icon: mdi:wrench
          show_state: false
          layout: icon_name
          tap_action:
            action: toggle
          state:
          - value: 'on'
            name: Manutenção ligada
            styles:
              card:
              - background: '#fb8c00'
              name:
              - color: '#fff'
              icon:
              - color: '#fff'
          styles:
            card:
            - background: var(--secondary-background-color, rgba(127,127,127,.15))
            - border-radius: 20px
            - padding: 7px 14px
            - box-shadow: none
            - border: none
            grid:
            - grid-template-areas: '"i n"'
            - grid-template-columns: 20px auto
            - column-gap: 6px
            icon:
            - width: 18px
            - color: var(--primary-text-color)
            name:
            - font-size: 14px
            - font-weight: '500'
            - justify-self: start
    grid_options:
      columns: 16
  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:button-card
      entity: sensor.cafes_hoje
      show_name: false
      show_icon: false
      show_state: false
      tap_action:
        action: more-info
      styles:
        card:
        - padding: 14px
        - border-radius: 16px
        - height: 166px
        - box-sizing: border-box
        grid:
        - grid-template-areas: '"x"'
        - grid-template-columns: 1fr
        - grid-template-rows: 1fr
        - align-content: stretch
        - height: 100%
        custom_fields:
          x:
          - width: 100%
          - text-align: left
          - height: 100%
      custom_fields:
        x: |
          [[[ const P=variables; const muted='var(--secondary-text-color)'; const n=e=>{const v=parseFloat(states[e]?.state); return isNaN(v)?0:v;};
          const tot=Math.round(n(P.tot)); const T=[['Café','Cafés',Math.round(n(P.caf)),'#b07a52'],['Cappuccino','Cappuccinos',Math.round(n(P.cap)),'#f0c987']];
          const soma=T.reduce((a,t)=>a+t[2],0)||1;
          const d=new Date(); let dias=1;
          if(P.per==='semana') dias=(d.getDay()+6)%7+1; else if(P.per==='mes') dias=d.getDate();
          else if(P.per==='ano'){ const s=states['sensor.cafes_por_hora_do_dia']?.attributes?.desde; const ds=s?new Date(s):new Date(d.getFullYear(),0,1); dias=Math.max(1,Math.floor((d-new Date(ds.getFullYear(),ds.getMonth(),ds.getDate()))/864e5)+1); }
          const fmt=x=>x.toLocaleString('pt-PT',{maximumFractionDigits:1});
          const sub=P.per==='hoje'?`${fmt(n('sensor.cafe_energia_hoje'))} Wh gastos nas bebidas`:`média de ${fmt(tot/dias)} por dia`+(P.per==='ano'?' desde o início':'');
          return `<div style="display:flex;flex-direction:column;justify-content:space-between;height:100%">
          <div style="display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:${muted}"><ha-icon icon="${P.icon}" style="margin:0;--mdc-icon-size:18px"></ha-icon>${P.title}</div>
          <div><div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:38px;font-weight:300;line-height:1;color:#b07a52">${tot}</span><span style="font-size:13px;color:${muted}">${tot===1?'bebida':'bebidas'}</span></div>
          <div style="font-size:12px;color:${muted};margin-top:4px">${sub}</div></div>
          <div><div style="display:flex;height:6px;border-radius:3px;overflow:hidden;background:rgba(127,127,127,.18)">${T.map(t=>t[2]?`<div style="width:${t[2]/soma*100}%;background:${t[3]}"></div>`:'').join('')}</div>
          <div style="display:flex;justify-content:space-between;font-size:11px;margin-top:4px;color:${muted}">${T.map(t=>`<span style="white-space:nowrap"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${t[3]};margin-right:4px"></span>${t[2]} ${t[2]===1?t[0].toLowerCase():t[1].toLowerCase()}</span>`).join('')}</div></div>
          </div>`; ]]]
      triggers_update:
      - sensor.cafes_hoje
      - sensor.cappuccinos_hoje
      - sensor.cafe_so_cafe_hoje
      - sensor.cafe_energia_hoje
      variables:
        tot: sensor.cafes_hoje
        cap: sensor.cappuccinos_hoje
        per: hoje
        title: Hoje
        icon: mdi:coffee
        caf: sensor.cafe_so_cafe_hoje
    - type: custom:button-card
      entity: sensor.cafes_esta_semana
      show_name: false
      show_icon: false
      show_state: false
      tap_action:
        action: more-info
      styles:
        card:
        - padding: 14px
        - border-radius: 16px
        - height: 166px
        - box-sizing: border-box
        grid:
        - grid-template-areas: '"x"'
        - grid-template-columns: 1fr
        - grid-template-rows: 1fr
        - align-content: stretch
        - height: 100%
        custom_fields:
          x:
          - width: 100%
          - text-align: left
          - height: 100%
      custom_fields:
        x: |
          [[[ const P=variables; const muted='var(--secondary-text-color)'; const n=e=>{const v=parseFloat(states[e]?.state); return isNaN(v)?0:v;};
          const tot=Math.round(n(P.tot)); const T=[['Café','Cafés',Math.round(n(P.caf)),'#b07a52'],['Cappuccino','Cappuccinos',Math.round(n(P.cap)),'#f0c987']];
          const soma=T.reduce((a,t)=>a+t[2],0)||1;
          const d=new Date(); let dias=1;
          if(P.per==='semana') dias=(d.getDay()+6)%7+1; else if(P.per==='mes') dias=d.getDate();
          else if(P.per==='ano'){ const s=states['sensor.cafes_por_hora_do_dia']?.attributes?.desde; const ds=s?new Date(s):new Date(d.getFullYear(),0,1); dias=Math.max(1,Math.floor((d-new Date(ds.getFullYear(),ds.getMonth(),ds.getDate()))/864e5)+1); }
          const fmt=x=>x.toLocaleString('pt-PT',{maximumFractionDigits:1});
          const sub=P.per==='hoje'?`${fmt(n('sensor.cafe_energia_hoje'))} Wh gastos nas bebidas`:`média de ${fmt(tot/dias)} por dia`+(P.per==='ano'?' desde o início':'');
          return `<div style="display:flex;flex-direction:column;justify-content:space-between;height:100%">
          <div style="display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:${muted}"><ha-icon icon="${P.icon}" style="margin:0;--mdc-icon-size:18px"></ha-icon>${P.title}</div>
          <div><div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:38px;font-weight:300;line-height:1;color:#b07a52">${tot}</span><span style="font-size:13px;color:${muted}">${tot===1?'bebida':'bebidas'}</span></div>
          <div style="font-size:12px;color:${muted};margin-top:4px">${sub}</div></div>
          <div><div style="display:flex;height:6px;border-radius:3px;overflow:hidden;background:rgba(127,127,127,.18)">${T.map(t=>t[2]?`<div style="width:${t[2]/soma*100}%;background:${t[3]}"></div>`:'').join('')}</div>
          <div style="display:flex;justify-content:space-between;font-size:11px;margin-top:4px;color:${muted}">${T.map(t=>`<span style="white-space:nowrap"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${t[3]};margin-right:4px"></span>${t[2]} ${t[2]===1?t[0].toLowerCase():t[1].toLowerCase()}</span>`).join('')}</div></div>
          </div>`; ]]]
      variables:
        tot: sensor.cafes_esta_semana
        cap: sensor.cappuccinos_esta_semana
        per: semana
        title: Esta semana
        icon: mdi:calendar-week
        caf: sensor.cafe_so_cafe_semana
      triggers_update:
      - sensor.cafes_esta_semana
      - sensor.cappuccinos_esta_semana
      - sensor.cafe_so_cafe_semana
      - sensor.cafe_energia_hoje
    - type: custom:button-card
      entity: sensor.cafes_este_mes
      show_name: false
      show_icon: false
      show_state: false
      tap_action:
        action: more-info
      styles:
        card:
        - padding: 14px
        - border-radius: 16px
        - height: 166px
        - box-sizing: border-box
        grid:
        - grid-template-areas: '"x"'
        - grid-template-columns: 1fr
        - grid-template-rows: 1fr
        - align-content: stretch
        - height: 100%
        custom_fields:
          x:
          - width: 100%
          - text-align: left
          - height: 100%
      custom_fields:
        x: |
          [[[ const P=variables; const muted='var(--secondary-text-color)'; const n=e=>{const v=parseFloat(states[e]?.state); return isNaN(v)?0:v;};
          const tot=Math.round(n(P.tot)); const T=[['Café','Cafés',Math.round(n(P.caf)),'#b07a52'],['Cappuccino','Cappuccinos',Math.round(n(P.cap)),'#f0c987']];
          const soma=T.reduce((a,t)=>a+t[2],0)||1;
          const d=new Date(); let dias=1;
