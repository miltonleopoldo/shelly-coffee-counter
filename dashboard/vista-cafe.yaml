        const one=async(id)=>{
         const r=await hass.callWS({type:'recorder/statistics_during_period',start_time:new Date(key(s)).toISOString(),end_time:e.toISOString(),statistic_ids:[id],period:P,types:['change']});
         const m=new Map(); (r[id]||[]).forEach(o=>{const k=key(o.start); m.set(k,(m.get(k)||0)+(o.change||0));});
         const t0=new Date(); t0.setHours(0,0,0,0);
         const q=(p)=>hass.callWS({type:'recorder/statistics_during_period',start_time:t0.toISOString(),statistic_ids:[id],period:p,types:['change']}).then(x=>(x[id]||[]).reduce((a,o)=>a+(o.change||0),0)).catch(()=>0);
         const vals=await Promise.all([q('5minute'),q('hour')]); const extra=vals[0]-vals[1]; const now=key(Date.now());
         if(Math.abs(extra)>1e-9) m.set(now,(m.get(now)||0)+extra);
         return m;};
        return Promise.all(SER.map(x=>one(x[0]))).then(ms=>{
         const out=[]; const d=new Date(key(+s+36e5));
